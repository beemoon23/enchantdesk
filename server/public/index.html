<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnchantDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D1712;
      --panel: #152420;
      --panel-border: #24382F;
      --gold: #E8B657;
      --teal: #5FBFA0;
      --erro: #C97B63;
      --text: #EDE8DA;
      --text-muted: #8FA396;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
    }

    .topo {
      padding: 36px 48px 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    .marca {
      font-family: 'Spectral', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 28px;
      color: var(--gold);
      margin: 0;
    }

    .marca span {
      font-family: 'IBM Plex Sans', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 14px;
      color: var(--text-muted);
      margin-left: 12px;
    }

    .central {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px;
      gap: 20px;
    }

    .rotulo {
      font-size: 14px;
      color: var(--text-muted);
    }

    .campo-id {
      display: flex;
      gap: 10px;
    }

    input#campo-id {
      font-family: 'IBM Plex Sans', monospace;
      font-size: 22px;
      letter-spacing: 2px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 6px;
      width: 260px;
      text-align: center;
    }

    input#campo-id:focus {
      outline: none;
      border-color: var(--gold);
    }

    button {
      font-family: inherit;
      background: var(--gold);
      color: var(--bg);
      border: none;
      padding: 0 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    button.secundario {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      font-size: 13px;
    }

    button:hover { opacity: 0.9; }

    button:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    .erro {
      color: var(--erro);
      font-size: 14px;
      min-height: 20px;
    }

    .barra-sessao {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 18px 48px;
      border-bottom: 1px solid var(--panel-border);
      flex-wrap: wrap;
    }

    .barra-sessao.ativa { display: flex; }

    .sessao-nome {
      font-size: 15px;
      color: var(--text-muted);
      font-family: 'IBM Plex Sans', monospace;
    }

    .espacador { flex: 1; }

    .progresso, .aviso-clipboard {
      font-size: 13px;
      color: var(--teal);
    }

    .palco {
      display: none;
      padding: 24px 48px 48px;
    }

    .palco.ativo { display: block; }

    .moldura {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--panel-border), 0 20px 60px -20px rgba(0,0,0,0.6);
    }

    #tela-remota {
      display: block;
      width: 100%;
      cursor: crosshair;
      outline: none;
    }

    .conectando {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="topo">
    <h1 class="marca">EnchantDesk<span>Vale Encantado</span></h1>
  </div>

  <div class="barra-sessao" id="barra-sessao">
    <button class="secundario" onclick="desconectar()">← Voltar</button>
    <span class="sessao-nome">Controlando <span id="id-sessao"></span></span>
    <div class="espacador"></div>
    <span class="progresso" id="progresso-envio"></span>
    <span class="aviso-clipboard" id="aviso-clipboard"></span>
    <button class="secundario" onclick="enviarClipboard()">📋 Colar no remoto</button>
    <button class="secundario" onclick="document.getElementById('input-arquivo').click()">Enviar arquivo</button>
    <input type="file" id="input-arquivo" style="display:none">
  </div>

  <div class="central" id="tela-inicial">
    <p class="rotulo">Digite o ID da máquina que deseja controlar</p>
    <div class="campo-id">
      <input type="text" id="campo-id" placeholder="000 000 000" maxlength="11">
      <button onclick="tentarConectar()">Conectar</button>
    </div>
    <p class="erro" id="mensagem-erro"></p>
  </div>

  <div class="palco" id="palco">
    <div class="moldura">
      <img id="tela-remota" alt="Tela remota" tabindex="0">
      <div class="conectando" id="conectando">Conectando à máquina remota...</div>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    ws.binaryType = 'arraybuffer';
    let assistindoAgora = null;
    let telaRemotaTamanho = { largura: 1920, altura: 1080 };
    let ultimaUrl = null;
    let primeiroFrameRecebido = false;

    const img = document.getElementById('tela-remota');
    const conectandoOverlay = document.getElementById('conectando');
    const campoId = document.getElementById('campo-id');
    const mensagemErro = document.getElementById('mensagem-erro');
    const inputArquivo = document.getElementById('input-arquivo');
    const progressoEnvio = document.getElementById('progresso-envio');
    const avisoClipboard = document.getElementById('aviso-clipboard');

    campoId.addEventListener('input', () => {
      let valor = campoId.value.replace(/\D/g, '').slice(0, 9);
      campoId.value = valor.match(/.{1,3}/g)?.join(' ') || valor;
    });

    campoId.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tentarConectar();
    });

    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) {
        processarFrameBinario(event.data);
        return;
      }
      const data = JSON.parse(event.data);
      if (data.tipo === 'erro') {
        mensagemErro.textContent = data.mensagem;
        conectandoOverlay.style.display = 'none';
      }
      if (data.tipo === 'clipboard') {
        receberClipboardRemoto(data.texto);
      }
    };

    async function receberClipboardRemoto(texto) {
      try {
        await navigator.clipboard.writeText(texto);
        avisoClipboard.textContent = '📋 Copiado da máquina remota';
        setTimeout(() => { avisoClipboard.textContent = ''; }, 3000);
      } catch (e) {
        console.error('Não foi possível escrever no clipboard:', e);
      }
    }

    async function enviarClipboard() {
      if (!assistindoAgora) return;
      try {
        const texto = await navigator.clipboard.readText();
        if (!texto) return;
        ws.send(JSON.stringify({ tipo: 'clipboard', texto }));
        avisoClipboard.textContent = '📋 Enviado para a máquina remota';
        setTimeout(() => { avisoClipboard.textContent = ''; }, 3000);
      } catch (e) {
        avisoClipboard.textContent = 'Não foi possível ler a área de transferência';
        setTimeout(() => { avisoClipboard.textContent = ''; }, 3000);
      }
    }

    function processarFrameBinario(buffer) {
      const view = new DataView(buffer);
      const tipo = view.getUint8(0);
      if (tipo !== 1) return;

      const largura = view.getUint16(1);
      const altura = view.getUint16(3);
      telaRemotaTamanho = { largura, altura };

      const jpegBytes = buffer.slice(5);
      const blob = new Blob([jpegBytes], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);

      if (ultimaUrl) URL.revokeObjectURL(ultimaUrl);
      ultimaUrl = url;
      img.src = url;

      if (!primeiroFrameRecebido) {
        primeiroFrameRecebido = true;
        conectandoOverlay.style.display = 'none';
      }
    }

    function tentarConectar() {
      const id = campoId.value.replace(/\D/g, '');
      if (id.length !== 9) {
        mensagemErro.textContent = 'Digite os 9 dígitos do ID.';
        return;
      }
      mensagemErro.textContent = '';
      assistindoAgora = id;
      primeiroFrameRecebido = false;

      ws.send(JSON.stringify({ tipo: 'conectar', id }));

      document.getElementById('id-sessao').textContent = campoId.value;
      document.getElementById('tela-inicial').style.display = 'none';
      document.getElementById('barra-sessao').classList.add('ativa');
      document.getElementById('palco').classList.add('ativo');
      conectandoOverlay.style.display = 'flex';
      img.focus();
    }

    function desconectar() {
      if (assistindoAgora) {
        ws.send(JSON.stringify({ tipo: 'desconectar', id: assistindoAgora }));
      }
      assistindoAgora = null;
      campoId.value = '';
      document.getElementById('tela-inicial').style.display = 'flex';
      document.getElementById('barra-sessao').classList.remove('ativa');
      document.getElementById('palco').classList.remove('ativo');
    }

    function calcularPosicao(evento) {
      const rect = img.getBoundingClientRect();
      const escalaX = telaRemotaTamanho.largura / rect.width;
      const escalaY = telaRemotaTamanho.altura / rect.height;
      const x = Math.round((evento.clientX - rect.left) * escalaX);
      const y = Math.round((evento.clientY - rect.top) * escalaY);
      return { x, y };
    }

    function enviarInput(dados) {
      if (!assistindoAgora) return;
      ws.send(JSON.stringify({ tipo: 'input', ...dados }));
    }

    let ultimoMovimento = 0;
    img.addEventListener('mousemove', (e) => {
      const agora = Date.now();
      if (agora - ultimoMovimento < 30) return;
      ultimoMovimento = agora;
      const { x, y } = calcularPosicao(e);
      enviarInput({ acao: 'mousemove', x, y });
    });

    img.addEventListener('mousedown', (e) => {
      const { x, y } = calcularPosicao(e);
      const botao = e.button === 2 ? 'right' : 'left';
      enviarInput({ acao: 'mousedown', x, y, botao });
    });

    img.addEventListener('mouseup', (e) => {
      const { x, y } = calcularPosicao(e);
      const botao = e.button === 2 ? 'right' : 'left';
      enviarInput({ acao: 'mouseup', x, y, botao });
    });

    img.addEventListener('contextmenu', (e) => e.preventDefault());

    img.addEventListener('keydown', (e) => {
      e.preventDefault();
      enviarInput({ acao: 'keydown', tecla: e.key });
    });

    const TAMANHO_CHUNK = 64 * 1024;

    inputArquivo.addEventListener('change', async () => {
      const arquivo = inputArquivo.files[0];
      if (!arquivo || !assistindoAgora) return;

      ws.send(JSON.stringify({ tipo: 'arquivo_inicio', nome: arquivo.name, tamanho: arquivo.size }));

      const buffer = await arquivo.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const totalChunks = Math.ceil(bytes.length / TAMANHO_CHUNK);

      for (let i = 0; i < totalChunks; i++) {
        const inicio = i * TAMANHO_CHUNK;
        const fim = Math.min(inicio + TAMANHO_CHUNK, bytes.length);
        const pedaco = bytes.slice(inicio, fim);

        let binario = '';
        for (let j = 0; j < pedaco.length; j++) binario += String.fromCharCode(pedaco[j]);
        const base64 = btoa(binario);

        ws.send(JSON.stringify({ tipo: 'arquivo_chunk', dados: base64 }));

        const porcentagem = Math.round(((i + 1) / totalChunks) * 100);
        progressoEnvio.textContent = `Enviando... ${porcentagem}%`;

        if (i % 5 === 0) await new Promise((r) => setTimeout(r, 5));
      }

      ws.send(JSON.stringify({ tipo: 'arquivo_fim' }));
      progressoEnvio.textContent = 'Arquivo enviado ✓';
      setTimeout(() => { progressoEnvio.textContent = ''; }, 3000);
      inputArquivo.value = '';
    });
  </script>
</body>
</html>
