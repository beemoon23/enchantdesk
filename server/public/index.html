<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EnchantDesk</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 40px; }
    h1 { color: #e94560; }
    .pc { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    #tela-remota { max-width: 100%; border: 2px solid #e94560; border-radius: 8px; margin-top: 20px; display: none; cursor: crosshair; outline: none; }
    #voltar { display: none; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🌟 EnchantDesk</h1>

  <button id="voltar" onclick="desconectar()">← Voltar pra lista</button>
  <div id="lista">Carregando...</div>
  <img id="tela-remota" alt="Tela remota" tabindex="0">

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    ws.binaryType = 'arraybuffer';
    let assistindoAgora = null;
    let telaRemotaTamanho = { largura: 1920, altura: 1080 };
    let ultimaUrl = null;

    const img = document.getElementById('tela-remota');

    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) {
        processarFrameBinario(event.data);
        return;
      }
      const data = JSON.parse(event.data);
      if (data.tipo === 'lista') {
        renderLista(data.agentes);
      }
    };

    function processarFrameBinario(buffer) {
      const view = new DataView(buffer);
      const tipo = view.getUint8(0);
      if (tipo !== 1) return;

      const largura = view.getUint16(1);
      const altura = view.getUint16(3);
      telaRemotaTamanho = { largura, altura };

      const jpegBytes = buffer.slice(5);
      const blob = new Blob([jpegBytes], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);

      if (ultimaUrl) URL.revokeObjectURL(ultimaUrl);
      ultimaUrl = url;
      img.src = url;
    }

    function renderLista(agentes) {
      const div = document.getElementById('lista');
      if (assistindoAgora) return;

      if (agentes.length === 0) {
        div.innerHTML = '<p>Nenhum PC online no momento.</p>';
        return;
      }
      div.innerHTML = agentes.map(a => `
        <div class="pc">
          <span>🟢 <strong>${a.nome}</strong> (${a.ip})</span>
          <button onclick="conectar('${a.nome}')">Conectar</button>
        </div>
      `).join('');
    }

    function conectar(nome) {
      assistindoAgora = nome;
      ws.send(JSON.stringify({ tipo: 'conectar', agente: nome }));
      document.getElementById('lista').style.display = 'none';
      img.style.display = 'block';
      document.getElementById('voltar').style.display = 'block';
      img.focus();
    }

    function desconectar() {
      if (assistindoAgora) {
        ws.send(JSON.stringify({ tipo: 'desconectar', agente: assistindoAgora }));
      }
      assistindoAgora = null;
      document.getElementById('lista').style.display = 'block';
      img.style.display = 'none';
      document.getElementById('voltar').style.display = 'none';
    }

    function calcularPosicao(evento) {
      const rect = img.getBoundingClientRect();
      const escalaX = telaRemotaTamanho.largura / rect.width;
      const escalaY = telaRemotaTamanho.altura / rect.height;
      const x = Math.round((evento.clientX - rect.left) * escalaX);
      const y = Math.round((evento.clientY - rect.top) * escalaY);
      return { x, y };
    }

    function enviarInput(dados) {
      if (!assistindoAgora) return;
      ws.send(JSON.stringify({ tipo: 'input', ...dados }));
    }

    let ultimoMovimento = 0;
    img.addEventListener('mousemove', (e) => {
      const agora = Date.now();
      if (agora - ultimoMovimento < 30) return;
      ultimoMovimento = agora;
      const { x, y } = calcularPosicao(e);
      enviarInput({ acao: 'mousemove', x, y });
    });

    img.addEventListener('mousedown', (e) => {
      const { x, y } = calcularPosicao(e);
      const botao = e.button === 2 ? 'right' : 'left';
      enviarInput({ acao: 'mousedown', x, y, botao });
    });

    img.addEventListener('mouseup', (e) => {
      const { x, y } = calcularPosicao(e);
      const botao = e.button === 2 ? 'right' : 'left';
      enviarInput({ acao: 'mouseup', x, y, botao });
    });

    img.addEventListener('contextmenu', (e) => e.preventDefault());

    img.addEventListener('keydown', (e) => {
      e.preventDefault();
      enviarInput({ acao: 'keydown', tecla: e.key });
    });
  </script>
</body>
</html>
